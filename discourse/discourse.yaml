apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: discourse
    app.kubernetes.io/part-of: helmforge
    app.kubernetes.io/version: 0.0.0-devel
  name: discourse-postgresql
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgresql
      app.kubernetes.io/name: discourse
      app.kubernetes.io/role: standalone
  serviceName: discourse-postgresql-primary-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgresql
        app.kubernetes.io/managed-by: timoni
        app.kubernetes.io/name: discourse
        app.kubernetes.io/part-of: helmforge
        app.kubernetes.io/role: standalone
        app.kubernetes.io/version: 0.0.0-devel
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - -c
        - config_file=/etc/postgresql/generated/postgresql.conf
        - -c
        - hba_file=/etc/postgresql/generated/pg_hba.conf
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: discourse
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: discourse-postgresql-auth
        - name: APP_DATABASE
          value: discourse
        - name: APP_USERNAME
          value: discourse
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: user-password
              name: discourse-postgresql-auth
        image: docker.io/pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - PGPASSWORD="${POSTGRES_PASSWORD}" pg_isready -U postgres -h 127.0.0.1
              -p 5432 -d postgres
          failureThreshold: 6
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
        name: postgresql
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - |-
              DATA_DIR="${PGDATA:-/var/lib/postgresql/data/pgdata}"
              if [ ! -s "${DATA_DIR}/PG_VERSION" ]; then
                exit 1
              fi
              export PGPASSWORD="${POSTGRES_PASSWORD}"
              if psql -U postgres -h 127.0.0.1 -p 5432 -d template1 -tAc "SELECT 1" >/dev/null 2>&1; then
                if ! psql -U postgres -h 127.0.0.1 -p 5432 -d template1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'postgres'" | grep -qx 1; then
                  createdb -U postgres -h 127.0.0.1 -p 5432 postgres
                fi
              else
                echo "Unable to verify or repair the postgres database on this PostgreSQL data directory." >&2
                exit 1
              fi
              PGPASSWORD="${POSTGRES_PASSWORD}" pg_isready -U postgres -h 127.0.0.1 -p 5432 -d postgres
          failureThreshold: 6
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - |-
              DATA_DIR="${PGDATA:-/var/lib/postgresql/data/pgdata}"
              if [ ! -s "${DATA_DIR}/PG_VERSION" ]; then
                exit 1
              fi
              export PGPASSWORD="${POSTGRES_PASSWORD}"
              if psql -U postgres -h 127.0.0.1 -p 5432 -d template1 -tAc "SELECT 1" >/dev/null 2>&1; then
                if ! psql -U postgres -h 127.0.0.1 -p 5432 -d template1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'postgres'" | grep -qx 1; then
                  createdb -U postgres -h 127.0.0.1 -p 5432 postgres
                fi
              else
                echo "Unable to verify or repair the postgres database on this PostgreSQL data directory." >&2
                exit 1
              fi
          failureThreshold: 60
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /etc/postgresql/generated
          name: config
        - mountPath: /docker-entrypoint-initdb.d
          name: initdb
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: default
      terminationGracePeriodSeconds: 120
      volumes:
      - configMap:
          name: discourse-postgresql-config
        name: config
      - name: initdb
        projected:
          defaultMode: 493
          sources:
          - configMap:
              name: discourse-postgresql-initdb
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/managed-by: timoni
        app.kubernetes.io/name: discourse
        app.kubernetes.io/part-of: helmforge
        app.kubernetes.io/version: 0.0.0-devel
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
