apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: discourse
    app.kubernetes.io/part-of: helmforge
    app.kubernetes.io/version: 0.0.0-devel
  name: discourse
  namespace: default
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discourse
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/name: discourse
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: DISCOURSE_HOSTNAME
          value: discourse.localhost
        - name: DISCOURSE_DEVELOPER_EMAILS
          value: admin@example.com
        - name: DISCOURSE_SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              key: secret-key-base
              name: discourse-app
        - name: DISCOURSE_DB_HOST
          value: discourse-postgresql
        - name: DISCOURSE_DB_PORT
          value: "5432"
        - name: DISCOURSE_DB_NAME
          value: discourse
        - name: DISCOURSE_DB_USERNAME
          value: discourse
        - name: DISCOURSE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: user-password
              name: discourse-postgresql-auth
        - name: DISCOURSE_REDIS_HOST
          value: discourse-redis-client
        - name: DISCOURSE_REDIS_PORT
          value: "6379"
        - name: DISCOURSE_SKIP_EMAIL_SETUP
          value: "1"
        - name: UNICORN_WORKERS
          value: "2"
        - name: UNICORN_SIDEKIQS
          value: "1"
        - name: MIGRATE_ON_BOOT
          value: "1"
        - name: PRECOMPILE_ON_BOOT
          value: "1"
        - name: CREATE_DB_ON_BOOT
          value: "0"
        image: docker.io/discourse/discourse:2026.7.4@sha256:8ae4f1e692a5da1548a36a6d9fc2bae18cf28d1efbebb12ba16928b31b14783d
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            httpHeaders:
            - name: Host
              value: discourse.localhost
            path: /srv/status
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
        name: discourse
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            httpHeaders:
            - name: Host
              value: discourse.localhost
            path: /srv/status
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 2000m
            memory: 3Gi
          requests:
            cpu: 250m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - NET_BIND_SERVICE
            - SETGID
            - SETUID
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          runAsUser: 0
        startupProbe:
          failureThreshold: 60
          httpGet:
            httpHeaders:
            - name: Host
              value: discourse.localhost
            path: /srv/status
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /shared
          name: shared
      initContainers:
      - command:
        - sh
        - -ec
        - |
          until nc -z -w 2 discourse-postgresql 5432; do sleep 2; done
          until nc -z -w 2 discourse-redis-client 6379; do sleep 2; done
        image: docker.io/library/busybox:1.37.0-uclibc
        imagePullPolicy: IfNotPresent
        name: wait-for-services
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 8Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: discourse
      terminationGracePeriodSeconds: 120
      volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: discourse-shared
---
