apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: n8n
    app.kubernetes.io/version: 0.0.0-devel
  name: n8n-n8n
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
    spec:
      affinity: {}
      automountServiceAccountToken: false
      containers:
      - env:
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: n8n-n8n-postgresql
        - name: DB_POSTGRESDB_PORT
          value: "5432"
        - name: DB_POSTGRESDB_DATABASE
          value: n8n
        - name: DB_POSTGRESDB_USER
          value: n8n
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: n8n-n8n-database
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: encryption-key
              name: n8n-n8n-encryption
        - name: N8N_PORT
          value: "5678"
        - name: N8N_LOG_LEVEL
          value: warn
        - name: N8N_LOG_OUTPUT
          value: console
        - name: N8N_DIAGNOSTICS_ENABLED
          value: "false"
        - name: N8N_GRACEFUL_SHUTDOWN_TIMEOUT
          value: "60"
        - name: N8N_RUNNERS_MODE
          value: external
        - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
          value: 0.0.0.0
        - name: N8N_RUNNERS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: auth-token
              name: n8n-n8n-task-runners
        - name: N8N_NATIVE_PYTHON_RUNNER
          value: "false"
        - name: EXECUTIONS_MODE
          value: queue
        - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
          value: "true"
        - name: QUEUE_BULL_REDIS_HOST
          value: n8n-n8n-redis-client
        - name: QUEUE_BULL_REDIS_PORT
          value: "6379"
        - name: QUEUE_BULL_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis-password
              name: n8n-n8n-redis-auth
        image: docker.io/n8nio/n8n:2.37.11
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 0
          periodSeconds: 15
          timeoutSeconds: 5
        name: n8n
        ports:
        - containerPort: 5678
          name: http
          protocol: TCP
        - containerPort: 5679
          name: runners
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz/readiness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /home/node/.n8n
          name: data
      - env:
        - name: N8N_RUNNERS_TASK_BROKER_URI
          value: http://127.0.0.1:5679
        - name: N8N_RUNNERS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: auth-token
              name: n8n-n8n-task-runners
        - name: N8N_RUNNERS_LAUNCHER_LOG_LEVEL
          value: warn
        - name: N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT
          value: "15"
        - name: N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT
          value: "5680"
        image: docker.io/n8nio/runners:2.37.11
        imagePullPolicy: IfNotPresent
        name: task-runners
        ports:
        - containerPort: 5680
          name: runner-health
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
      initContainers:
      - command:
        - sh
        - -c
        - |-
          echo "Waiting for n8n-n8n-postgresql:5432 ..."
          until nc -z -w2 n8n-n8n-postgresql 5432; do
            sleep 2
          done
          echo "Database is reachable."
        image: docker.io/library/busybox:1.37
        imagePullPolicy: IfNotPresent
        name: wait-for-db
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
      - command:
        - sh
        - -c
        - |-
          echo "Waiting for n8n-n8n-redis-client:6379 ..."
          until nc -z -w2 n8n-n8n-redis-client 6379; do
            sleep 2
          done
          echo "Redis is reachable."
        image: docker.io/library/busybox:1.37
        imagePullPolicy: IfNotPresent
        name: wait-for-redis
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: n8n-n8n
      terminationGracePeriodSeconds: 75
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: n8n-n8n-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: n8n
    app.kubernetes.io/version: 0.0.0-devel
  name: n8n-n8n-worker
