apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: n8n
    app.kubernetes.io/version: 0.0.0-devel
  name: n8n-n8n-postgresql
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/name: postgresql
  serviceName: n8n-n8n-postgresql-primary-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: n8n
        app.kubernetes.io/name: postgresql
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_DB
          value: n8n
        - name: POSTGRES_USER
          value: n8n
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: user-password
              name: n8n-n8n-postgresql-auth
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: docker.io/library/postgres:18.6-alpine
        imagePullPolicy: IfNotPresent
        name: postgresql
        ports:
        - containerPort: 5432
          name: postgresql
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 70
          runAsNonRoot: true
          runAsUser: 70
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: initdb
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: n8n-n8n
      volumes:
      - configMap:
          defaultMode: 493
          name: n8n-n8n-postgresql-initdb
        name: initdb
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
---
apiVersion: v1
data:
  02-n8n-extensions.sh: |-
    #!/bin/bash
    set -euo pipefail
    export PGPASSWORD="${POSTGRES_PASSWORD}"
    psql --username "${POSTGRES_USER}" --dbname "${APP_DATABASE}" \
      -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
