      affinity: {}
      automountServiceAccountToken: false
      containers:
      - command:
        - n8n
        - worker
        - --concurrency=10
        env:
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: n8n-n8n-postgresql
        - name: DB_POSTGRESDB_PORT
          value: "5432"
        - name: DB_POSTGRESDB_DATABASE
          value: n8n
        - name: DB_POSTGRESDB_USER
          value: n8n
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: n8n-n8n-database
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: encryption-key
              name: n8n-n8n-encryption
        - name: N8N_DIAGNOSTICS_ENABLED
          value: "false"
        - name: N8N_GRACEFUL_SHUTDOWN_TIMEOUT
          value: "60"
        - name: N8N_RUNNERS_MODE
          value: external
        - name: N8N_RUNNERS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: auth-token
              name: n8n-n8n-task-runners
        - name: N8N_NATIVE_PYTHON_RUNNER
          value: "false"
        - name: EXECUTIONS_MODE
          value: queue
        - name: QUEUE_BULL_REDIS_HOST
          value: n8n-n8n-redis-client
        - name: QUEUE_BULL_REDIS_PORT
          value: "6379"
        - name: QUEUE_BULL_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis-password
              name: n8n-n8n-redis-auth
        image: docker.io/n8nio/n8n:2.37.11
        imagePullPolicy: IfNotPresent
        name: worker
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /home/node/.n8n
          name: data
      - env:
        - name: N8N_RUNNERS_TASK_BROKER_URI
          value: http://127.0.0.1:5679
        - name: N8N_RUNNERS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: auth-token
              name: n8n-n8n-task-runners
        - name: N8N_RUNNERS_LAUNCHER_LOG_LEVEL
          value: warn
        - name: N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT
          value: "15"
        - name: N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT
          value: "5680"
        image: docker.io/n8nio/runners:2.37.11
        imagePullPolicy: IfNotPresent
        name: task-runners
        ports:
        - containerPort: 5680
          name: runner-health
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
      initContainers:
      - command:
        - sh
        - -c
        - |-
          echo "Waiting for n8n-n8n-postgresql:5432 ..."
          until nc -z -w2 n8n-n8n-postgresql 5432; do
            sleep 2
          done
          echo "Database is reachable."
        image: docker.io/library/busybox:1.37
        imagePullPolicy: IfNotPresent
        name: wait-for-db
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
      - command:
        - sh
        - -c
        - |-
          echo "Waiting for n8n-n8n-redis-client:6379 ..."
          until nc -z -w2 n8n-n8n-redis-client 6379; do
            sleep 2
          done
          echo "Redis is reachable."
        image: docker.io/library/busybox:1.37
        imagePullPolicy: IfNotPresent
        name: wait-for-redis
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
      - command:
        - sh
        - -c
        - |-
          echo "Waiting for n8n main readiness..."
          until wget -qO- http://n8n-n8n:80/healthz/readiness >/dev/null 2>&1; do
            sleep 2
          done
          echo "n8n main is ready."
        image: docker.io/library/busybox:1.37
        imagePullPolicy: IfNotPresent
        name: wait-for-main
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
      nodeSelector:
        kubernetes.io/os: linux
